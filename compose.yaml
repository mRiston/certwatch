services:
  certwatch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certwatch
    restart: unless-stopped
    ports:
      - "${CERTWATCH_PORT:-8080}:8080"
    environment:
      CERTWATCH_DB_PATH: /data/certwatch.db
      CERTWATCH_CONFIG_FILE: /app/config/endpoints.yaml
      CERTWATCH_DNS_PRIMARY: "${DNS_PRIMARY:-}"
      CERTWATCH_DNS_SECONDARY: "${DNS_SECONDARY:-}"
      TZ: "${TZ:-America/New_York}"
    volumes:
      - certwatch-data:/data
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  certwatch-data:
