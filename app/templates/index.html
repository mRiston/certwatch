<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CertWatch</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/dashboard.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <h1>CertWatch</h1>
        <p>Read-only TLS certificate inventory</p>
      </div>
      <nav class="nav" aria-label="Primary navigation">
        <a href="/" aria-current="page">Dashboard</a>
        <a href="/configuration">Configuration</a>
        <button id="scan-button" type="button">Scan now</button>
      </nav>
    </header>

    <section class="cards" aria-label="Certificate summary">
      <article class="card"><span class="label">Healthy</span><span id="count-healthy" class="value healthy">0</span></article>
      <article class="card"><span class="label">Warning</span><span id="count-warning" class="value warning">0</span></article>
      <article class="card"><span class="label">Critical</span><span id="count-critical" class="value critical">0</span></article>
      <article class="card"><span class="label">Expired</span><span id="count-expired" class="value expired">0</span></article>
      <article class="card"><span class="label">Unreachable</span><span id="count-unreachable" class="value unreachable">0</span></article>
    </section>

    <section class="panel">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Endpoint</th><th>Environment</th><th>Service</th><th>Expires</th><th>Days</th><th>Status</th><th>Last scan</th></tr></thead>
          <tbody id="certificate-rows"><tr><td colspan="7" class="empty">Loading certificate inventory…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
